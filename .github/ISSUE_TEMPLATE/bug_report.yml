name: Bug report
description: Report a reproducible defect
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, signing material, private datasets, or exploitable vulnerability details.
        Security reports must follow SECURITY.md and use private reporting when available.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, version, device, branch, commit SHA, or other relevant context.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, test output, or other non-sensitive evidence.
