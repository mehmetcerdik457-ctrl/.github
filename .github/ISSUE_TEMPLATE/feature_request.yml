name: Feature request
description: Propose a new capability or improvement
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the desired behavior or outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete conditions that would make this complete.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options:
        - None / low risk
        - Security
        - AI / model behavior
        - Android / device
        - Infrastructure / cloud
        - Release / signing
        - Data / privacy
    validations:
      required: true
