name: Account Governance Self-Test

on:
  push:
    branches: [main, account-governance-hardening-v2-20260919]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          check-latest: false

      - name: Validate governance policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          required = [
              Path("SECURITY.md"),
              Path("CONTRIBUTING.md"),
              Path("SUPPORT.md"),
              Path("CODE_OF_CONDUCT.md"),
              Path(".github/CODEOWNERS"),
              Path(".github/PULL_REQUEST_TEMPLATE.md"),
              Path(".github/ISSUE_TEMPLATE/bug.yml"),
              Path(".github/ISSUE_TEMPLATE/feature.yml"),
              Path(".github/ISSUE_TEMPLATE/config.yml"),
              Path(".github/workflows/reusable-privacy-guard.yml"),
              Path(".github/workflows/reusable-node-baseline.yml"),
              Path(".github/workflows/reusable-python-baseline.yml"),
              Path(".github/workflows/reusable-scorecard.yml"),
              Path(".github/workflows/reusable-codeql-python-actions.yml"),
              Path(".github/workflows/reusable-dependency-review.yml"),
              Path(".github/workflows/reusable-repository-policy.yml"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"MISSING_REQUIRED={missing}")

          duplicates = [
              Path(".github/ISSUE_TEMPLATE/bug_report.yml"),
              Path(".github/ISSUE_TEMPLATE/feature_request.yml"),
              Path("CODEOWNERS"),
              Path("PULL_REQUEST_TEMPLATE.md"),
              Path("ISSUE_TEMPLATE/config.yml"),
          ]
          present = [str(p) for p in duplicates if p.exists()]
          if present:
              raise SystemExit(f"DUPLICATE_GOVERNANCE_FILES={present}")

          action_ref = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-fA-F]{40}$")
          uses = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          count = 0

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*permissions:\s*write-all\s*$", text):
                  raise SystemExit(f"WRITE_ALL_FORBIDDEN={path}")
              if re.search(r"(?m)^\s*pull_request_target\s*:", text):
                  raise SystemExit(f"PULL_REQUEST_TARGET_FORBIDDEN={path}")
              if re.search(r"(?m)^\s*python-version:\s*['\"]?3\.x['\"]?\s*$", text):
                  raise SystemExit(f"FLOATING_PYTHON_FORBIDDEN={path}")
              for line in text.splitlines():
                  m = uses.match(line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith("./"):
                      continue
                  count += 1
                  if not action_ref.fullmatch(ref):
                      raise SystemExit(f"MUTABLE_ACTION_REF={path}:{ref}")

          node = Path(".github/workflows/reusable-node-baseline.yml").read_text(encoding="utf-8")
          if "default: '24.21.0'" not in node or "cache: npm" in node:
              raise SystemExit("NODE_BASELINE_NOT_EXACT_OR_CACHE_ENABLED")

          py = Path(".github/workflows/reusable-python-baseline.yml").read_text(encoding="utf-8")
          if "python-version: '3.14.7'" not in py:
              raise SystemExit("PYTHON_BASELINE_NOT_EXACT")

          print(f"IMMUTABLE_ACTION_REFS={count}")
          print("ACCOUNT_GOVERNANCE_POLICY=PASS")
          PY

  privacy:
    uses: ./.github/workflows/reusable-privacy-guard.yml

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql-python-actions.yml

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-dependency-review.yml

  repository-policy:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-repository-policy.yml
    with:
      require-governance: true
