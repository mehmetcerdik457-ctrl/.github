name: Reusable Node Baseline

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major/version selector
        required: false
        type: string
        default: '22'
      run-tests:
        description: Run npm test in non-watch mode
        required: false
        type: boolean
        default: true
      run-build:
        description: Run npm build
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        if: inputs.run-tests
        run: npm test -- --run

      - name: Build
        if: inputs.run-build
        run: npm run build
