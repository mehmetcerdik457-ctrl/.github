name: Reusable Node Baseline

on:
  workflow_call:
    inputs:
      node-version:
        description: Exact Node.js runtime version
        required: false
        type: string
        default: '24.21.0'
      run-tests:
        description: Run npm test in non-watch mode
        required: false
        type: boolean
        default: true
      run-build:
        description: Run npm build
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: false

      - name: Verify locked dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node --version
          npm --version

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test
        if: inputs.run-tests
        run: npm test -- --run

      - name: Build
        if: inputs.run-build
        run: npm run build
