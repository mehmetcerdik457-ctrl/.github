name: Reusable Repository Policy

on:
  workflow_call:
    inputs:
      require-governance:
        description: Require the account AI repository governance baseline
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce repository security policy
        env:
          REQUIRE_GOVERNANCE: ${{ inputs.require-governance }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(".")
          workflow_dir = root / ".github" / "workflows"

          def fail(message: str) -> None:
              raise SystemExit(f"REPOSITORY_POLICY_FAIL={message}")

          if not workflow_dir.is_dir():
              fail("missing .github/workflows")

          require_governance = os.environ.get("REQUIRE_GOVERNANCE", "true").lower() == "true"
          if require_governance:
              required = [
                  root / ".github" / "CODEOWNERS",
                  root / ".github" / "dependabot.yml",
                  root / ".github" / "PULL_REQUEST_TEMPLATE.md",
                  root / "SECURITY.md",
                  root / ".gitignore",
              ]
              missing = [str(p) for p in required if not p.is_file()]
              if missing:
                  fail(f"missing governance files: {missing}")

          tracked_env = []
          for path in root.rglob(".env*"):
              if ".git" in path.parts:
                  continue
              rel = path.as_posix().lstrip("./")
              if re.search(r"(^|/)\.env\.(example|sample|template)$", rel):
                  continue
              tracked_env.append(rel)
          if tracked_env:
              fail(f"private environment files present: {tracked_env}")

          action_ref = re.compile(
              r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-fA-F]{40}$"
          )
          uses = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          checkout = "uses: actions/checkout@"
          count = 0

          for path in sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml")):
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^permissions:\s*$", text) is None:
                  fail(f"{path}: explicit top-level permissions required")
              if re.search(r"(?m)^\s*permissions:\s*write-all\s*$", text):
                  fail(f"{path}: write-all forbidden")
              if re.search(r"(?m)^\s*pull_request_target\s*:", text):
                  fail(f"{path}: pull_request_target forbidden")
              if re.search(r"(?m)^\s*runs-on:\s*[^\n]*-latest\s*$", text):
                  fail(f"{path}: floating runner label forbidden")
              if re.search(r"(?m)^\s*python-version:\s*['\"]?3\.x['\"]?\s*$", text):
                  fail(f"{path}: floating Python 3.x forbidden")

              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if checkout in line:
                      window = "\n".join(lines[i:i + 12])
                      if re.search(r"(?m)^\s*persist-credentials:\s*false\s*$", window) is None:
                          fail(f"{path}: checkout must set persist-credentials: false")

                  match = uses.match(line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if ref.startswith("./"):
                      continue
                  count += 1
                  if not action_ref.fullmatch(ref):
                      fail(f"{path}: mutable or unsupported action reference: {ref}")

          if count == 0:
              fail("no third-party action references found")

          package_json = root / "package.json"
          if package_json.is_file() and not any(
              (root / name).is_file()
              for name in ("package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock")
          ):
              fail("package.json exists without a dependency lockfile")

          print(f"IMMUTABLE_ACTION_REFS={count}")
          print("REPOSITORY_POLICY=PASS")
          PY
