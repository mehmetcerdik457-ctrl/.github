name: Reusable OpenSSF Scorecard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scorecard:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Preserve Scorecard SARIF evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-${{ github.sha }}
          path: scorecard-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Publish SARIF to GitHub Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: scorecard-results.sarif
